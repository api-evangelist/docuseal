- aid: docuseal:docuseal-templates-api
  name: DocuSeal Templates API
  description: >-
    Templates represent reusable document signing forms with fields and signatures to be collected. It's
    possible to create unique template forms with fields and signatures using HTML or with tagged PDFs.
