apis:
- aid: docuseal:docuseal-submissions-api
  name: DocuSeal Submissions API
  description: >-
    Signature requests can be initiated with Submissions API. Submissions can contain one submitter if
    signed by a single party or multiple submitters if the document template form contains signatures
    and fields to be collected and filled by multiple parties. Initiate new submissions to request signatures
    for specified submitters via email or phone number.
  humanURL: https://www.docuseal.com/docs/api
  baseURL: https://api.docuseal.com
  tags:
  - Submissions
  properties:
  - type: OpenAPI
    url: openapi/docuseal-submissions-api-openapi.yml
  - type: Documentation
    url: https://www.docuseal.com/docs/api
- aid: docuseal:docuseal-submitters-api
  name: DocuSeal Submitters API
  description: Submitters API allows you to load all details provided by the signer of the document.
