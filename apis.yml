created: 2026-06-12
modified: 2026-06-12
specificationVersion: "0.19"
description: >
  DocuSeal is an open-source document signing platform that provides a REST API
  for building electronic signature workflows into applications. The API supports
  creating and managing templates, sending signature requests via submissions, and
  tracking signing status through submitter endpoints. DocuSeal supports embedding
  signing forms directly into web applications using JavaScript SDKs for React,
  Vue, and Angular. Webhooks deliver real-time events when documents are viewed,
  started, or completed by signers. The platform is available as a cloud-hosted
  service with US and EU data residency options, or as a self-hosted on-premises
  deployment under an AGPL-3.0 open-source license.
